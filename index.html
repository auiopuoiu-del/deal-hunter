function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function typeCls(t){return t==="真免费"?"free":t==="免费试用"?"trial":t==="抽奖"?"lot":t==="需绑卡验证"?"card":""}
function card(d){

function section(id, title, list, emptyText){

  return `<section id="${id}"><h2>${title}</h2>${body}</section>`;
}
function render(){

  const latest = [...active].sort(byVer);

  const ending = active.filter(d=>d.deadline);

    section("latest","A · 今日最新优惠", latest, "暂无条目") +
